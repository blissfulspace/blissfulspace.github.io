<!DOCTYPE html>
<html lang="en">
<head>

<title>Mandarin with Claude</title>
<style>

  #app { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0 14px;
  }
  .topbar .home-btn {
    background: #ffffffcc; border: none; font-size: 24px; cursor: pointer;
    padding: 6px 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(230,120,80,.15);
  }
  .topbar .crumb { font-size: 15px; color: #a08872; text-align: right; }

  h1, h2 { font-family: "Fredoka", "Segoe UI", sans-serif; letter-spacing: .2px; }
  h1 { font-size: 30px; margin-bottom: 4px; color: #e2504c; }
  h2 { font-size: 23px; margin-bottom: 10px; color: #7a4bbf; }
  .subtitle { color: #a08872; margin-bottom: 20px; font-size: 16px; }

  .card {
    background: #fffdf9;
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 6px 20px rgba(235, 120, 90, .13);
  }

  .hanzi { font-size: 64px; text-align: center; line-height: 1.2; margin: 8px 0; }
  .hanzi-small { font-size: 40px; }
  .pinyin { font-size: 28px; text-align: center; color: #e2504c; font-weight: 700; margin-bottom: 2px;
            font-family: "Fredoka", sans-serif; }
  .soundslike { text-align: center; font-size: 17px; color: #1e9e63; font-weight: 600; margin-bottom: 4px; }
  .english { font-size: 19px; text-align: center; color: #7b6a58; margin-bottom: 10px; }

  button.big {
    display: block; width: 100%;
    min-height: 58px;
    font-size: 19px; font-weight: 600;
    font-family: "Fredoka", "Segoe UI", sans-serif;
    border: none; border-radius: 18px;
    cursor: pointer;
    margin: 10px 0;
    padding: 14px 18px;
    color: #fff;
    background: linear-gradient(135deg, #ff6b6b, #ff9e5e);
    box-shadow: 0 4px 12px rgba(255, 197, 138, .5);
    transition: transform .06s;
  }
  button.big:active { transform: scale(.97); }
  button.big.green  { background: linear-gradient(135deg, #43c76b, #1e9e63); box-shadow: 0 4px 12px rgba(120,210,150,.45); }
  button.big.blue   { background: linear-gradient(135deg, #4aa8f7, #3b6fd4); box-shadow: 0 4px 12px rgba(140,180,245,.45); }
  button.big.teal   { background: linear-gradient(135deg, #2bd4a7, #14a0a0); box-shadow: 0 4px 12px rgba(120,220,200,.45); }
  button.big.amber  { background: linear-gradient(135deg, #ffb84d, #ff7a59); box-shadow: 0 4px 12px rgba(255,190,120,.5); }
  button.big.grey   { background: #ffffffd9; color: #7b6a58; box-shadow: 0 2px 8px rgba(200,160,120,.2); font-weight: 500; }
  button.big.outline {
    background: #fffdf9; color: #e2504c; border: 2px solid #ffb1a8; box-shadow: none;
  }
  button.big:disabled { opacity: .45; cursor: default; }

  .btn-row { display: flex; gap: 10px; }
  .btn-row button.big { flex: 1; }

  .progressbar {
    height: 10px; background: #ffffffb0; border-radius: 6px; margin-bottom: 18px; overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(200,150,110,.25);
  }
  .progressbar > div { height: 100%; background: linear-gradient(90deg, #ff6b6b, #ffb84d); border-radius: 6px; transition: width .3s; }

  .feedback {
    border-radius: 14px; padding: 14px 16px; margin-top: 12px; font-size: 17px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.good { background: #e2f8e7; color: #1d6e33; }
  .feedback.bad  { background: #ffe9e6; color: #a03028; }
  .feedback.info { background: #e7f1fd; color: #2a5aa8; }
  .fb-row { display: flex; gap: 8px; margin: 10px 0 4px; }
  .fb-row button {
    flex: 1; min-height: 44px; font-size: 15px; font-weight: 600; color: #fff;
    border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, #4aa8f7, #3b6fd4);

  .tone-svg { display: block; margin: 0 auto 6px; }

  .tone-chips { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 4px; }
  .chips-label { text-align: center; font-size: 14px; color: #a08872; margin-top: 8px; }
  .chip {
    border-radius: 14px; padding: 8px 12px; text-align: center; min-width: 78px;

  .chip .chip-p { font-weight: 700; font-size: 17px; font-family: "Fredoka", sans-serif; }

    background: linear-gradient(135deg, #ff6b6b, #ffb84d);
    color: #fff; font-size: 21px; font-weight: 700;

    display: flex; align-items: center; justify-content: center; flex-shrink: 0;

  .lesson-item.locked .num { background: #d8c8b4; }

<body>
<div id="app"></div>
<script>
"use strict";

/* ============================================================
   TONE COLOURS & LABELS — used everywhere so each tone builds
   a consistent colour memory
   ============================================================ */

const TONE_COLORS = { 0: "#8d8d94", 1: "#e53935", 2: "#1e9e63", 3: "#3b6fd4", 4: "#8e44ad" };
const TONE_LABELS = { 0: "light ·", 1: "1st · flat →", 2: "2nd · rise ↗", 3: "3rd · dip ↓↑", 4: "4th · fall ↘" };
const TONE_WORDS  = { 0: "light and quick", 1: "high and flat", 2: "rising", 3: "dipping down then up", 4: "falling sharply" };

const TONE_PATHS = {
  1: "M10,30 L110,30",
  2: "M10,55 L110,15",
  3: "M10,35 Q55,75 70,55 T110,20",
  4: "M10,15 L110,70"
};

function curveSvg(tone, w, dashed) {
  const color = TONE_COLORS[tone];
  const inner = tone === 0
    ? `<circle cx="60" cy="55" r="9" fill="${color}"/>`
    : `<path d="${TONE_PATHS[tone]}" stroke="${color}" stroke-width="9" fill="none" stroke-linecap="round"${dashed ? ' stroke-dasharray="14 10"' : ""}/>`;
  return `<svg width="${w}" height="${Math.round(w * 0.71)}" viewBox="0 0 120 85">${inner}</svg>`;
}

/* ============================================================
   DATA
   ============================================================ */

const TONES = [
  { n: 1, name: "First tone — high and flat",
    hanzi: "妈", pinyin: "mā", phon: "mah", meaning: "mother",
    desc: "Hold your voice high and level, like singing one steady note: maaa." },
  { n: 2, name: "Second tone — rising",
    hanzi: "麻", pinyin: "má", phon: "mah?", meaning: "hemp / numb",
    desc: "Rise from the middle upwards, like asking a question: ma?" },
  { n: 3, name: "Third tone — dip down, then up",
    hanzi: "马", pinyin: "mǎ", phon: "ma-ah", meaning: "horse",
    desc: "Start mid, dip low, then rise. Like a doubtful \"we-ell...\" This is the tricky one!" },
  { n: 4, name: "Fourth tone — sharp fall",
    hanzi: "骂", pinyin: "mà", phon: "mah!", meaning: "to scold",
    desc: "Drop sharply from high to low, like a firm \"No!\"" }
];

const LESSONS = [
  {
    id: "lesson1",
    title: "Tones & first greetings",
    desc: "The four tones · hello · thank you · goodbye",
    phrases: [
      { hanzi: "你好", pinyin: "nǐ hǎo", english: "Hello", phon: "nee-how",
        syll: ["你", "好"], psyll: ["nǐ", "hǎo"], ptones: [3, 3],
        accept: ["你好", "妳好"],
        spoken: { psyll: ["ní", "hǎo"], ptones: [2, 3] },
        note: "Two dips in a row is awkward to say, so Chinese speakers turn the first into a rise. Say it like <b>\"nee?\"</b> (rising, as if asking a question) then <b>\"how\"</b> (dipping). The 🔊 button says it this natural way — that's why it may not sound like two dips." },
      { hanzi: "你好吗？", pinyin: "nǐ hǎo ma?", english: "How are you?", phon: "nee-how-mah",
        syll: ["你", "好", "吗"], psyll: ["nǐ", "hǎo", "ma"], ptones: [3, 3, 0],
        accept: ["你好吗", "你好嗎"],
        spoken: { psyll: ["ní", "hǎo", "ma"], ptones: [2, 3, 0] },
        note: "Same trick as 你好: say <b>\"nee?\"</b> (rising) then <b>\"how\"</b> (dipping), and tack a quick light <b>\"mah\"</b> on the end." },
      { hanzi: "我很好", pinyin: "wǒ hěn hǎo", english: "I'm very well", phon: "wor-hun-how",
        syll: ["我", "很", "好"], psyll: ["wǒ", "hěn", "hǎo"], ptones: [3, 3, 3],
        accept: ["我很好"],
        spoken: { psyll: ["wó", "hén", "hǎo"], ptones: [2, 2, 3] },
        note: "Three dips in a row — nobody says that! The first two become rises: <b>\"wor?\"</b> <b>\"hun?\"</b> (both rising) then <b>\"how\"</b> (dipping on the last one only)." },
      { hanzi: "谢谢", pinyin: "xièxie", english: "Thank you", phon: "shyeh-shyeh",
        syll: ["谢", "谢"], psyll: ["xiè", "xie"], ptones: [4, 0],
        accept: ["谢谢", "謝謝"] },
      { hanzi: "再见", pinyin: "zàijiàn", english: "Goodbye", phon: "dzeye-jyen",
        syll: ["再", "见"], psyll: ["zài", "jiàn"], ptones: [4, 4],
        accept: ["再见", "再見"] }
    ],
    quiz: [
      { type: "tone", play: "妈", pinyin: "mā", answer: 1 },
      { type: "tone", play: "骂", pinyin: "mà", answer: 4 },
      { type: "tone", play: "麻", pinyin: "má", answer: 2 },
      { type: "tone", play: "马", pinyin: "mǎ", answer: 3 },
      { type: "meaning", q: "What does 谢谢 (xièxie) mean?",
        options: ["Hello", "Thank you", "Goodbye", "How are you?"], answer: 1 },
      { type: "meaning", q: "How do you say \"Goodbye\"?",
        options: ["nǐ hǎo", "wǒ hěn hǎo", "zàijiàn", "xièxie"], answer: 2 },
      { type: "meaning", q: "What does 你好吗 (nǐ hǎo ma) mean?",
        options: ["I'm very well", "Thank you", "Hello", "How are you?"], answer: 3 },
      { type: "meaning", q: "Which phrase means \"I'm very well\"?",
        options: ["wǒ hěn hǎo", "nǐ hǎo", "zàijiàn", "nǐ hǎo ma"], answer: 0 }
    ]
  }
];

/* Small hanzi→pinyin dictionary so we can spell out what the
   recogniser heard. Covers lesson words and likely near-misses. */
const PINYIN = {
  "你":"nǐ","妳":"nǐ","好":"hǎo","吗":"ma","嗎":"ma","我":"wǒ","很":"hěn","谢":"xiè","謝":"xiè",
  "再":"zài","见":"jiàn","見":"jiàn","妈":"mā","媽":"mā","麻":"má","马":"mǎ","馬":"mǎ","骂":"mà","罵":"mà","嘛":"ma",
  "泥":"ní","尼":"ní","妮":"nī","呢":"ne","哪":"nǎ","那":"nà","呀":"ya","啊":"a","阿":"ā","哦":"ó","噢":"ō","喔":"ō",
  "一":"yī","二":"èr","三":"sān","四":"sì","五":"wǔ","六":"liù","七":"qī","八":"bā","九":"jiǔ","十":"shí",
  "百":"bǎi","千":"qiān","万":"wàn","零":"líng","不":"bù","是":"shì","的":"de","了":"le","在":"zài","有":"yǒu",
  "人":"rén","大":"dà","小":"xiǎo","上":"shàng","下":"xià","来":"lái","去":"qù","吃":"chī","喝":"hē","水":"shuǐ",
  "茶":"chá","他":"tā","她":"tā","它":"tā","们":"men","这":"zhè","什":"shén","么":"me","谁":"shéi","里":"lǐ",
  "要":"yào","想":"xiǎng","会":"huì","能":"néng","说":"shuō","话":"huà","看":"kàn","听":"tīng","读":"dú","写":"xiě",
  "学":"xué","生":"shēng","老":"lǎo","师":"shī","中":"zhōng","国":"guó","英":"yīng","文":"wén","汉":"hàn","语":"yǔ",
  "些":"xiē","鞋":"xié","卸":"xiè","蟹":"xiè","号":"hào","毫":"háo","豪":"háo","耗":"hào","和":"hé","河":"hé",
  "合":"hé","何":"hé","贺":"hè","恨":"hèn","狠":"hěn","痕":"hén","哼":"hēng","窝":"wō","握":"wò","卧":"wò",
  "沃":"wò","无":"wú","屋":"wū","午":"wǔ","载":"zài","仔":"zǎi","灾":"zāi","栽":"zāi","宰":"zǎi",
  "件":"jiàn","建":"jiàn","健":"jiàn","间":"jiān","简":"jiǎn","剑":"jiàn","肩":"jiān","尖":"jiān","减":"jiǎn","检":"jiǎn",
  "白":"bái","拜":"bài","爸":"bà","吧":"ba","把":"bǎ","巴":"bā","拔":"bá","罢":"bà","办":"bàn","半":"bàn",
  "每":"měi","美":"měi","妹":"mèi","没":"méi","梅":"méi","门":"mén","慢":"màn","满":"mǎn","买":"mǎi","卖":"mài",
  "米":"mǐ","面":"miàn","明":"míng","名":"míng","命":"mìng","摸":"mō","磨":"mó","抹":"mǒ","末":"mò","墨":"mò",
  "母":"mǔ","木":"mù","目":"mù","拿":"ná","纳":"nà","男":"nán","南":"nán","难":"nán","脑":"nǎo","闹":"nào",
  "孩":"hái","还":"hái","海":"hǎi","害":"hài","后":"hòu","猴":"hóu","吼":"hǒu","厚":"hòu","内":"nèi","念":"niàn"
};

function pinyinFor(str) {
  const clean = String(str).replace(/[，。？！?,.!\s]/g, "");
  const parts = [];
  for (const ch of clean) parts.push(PINYIN[ch] || "?");
  return parts.join(" ");
}

/* ============================================================
   PROGRESS — saved on this device
   ============================================================ */

function loadProgress() {
  try { return JSON.parse(localStorage.getItem("mandarin-progress")) || {}; }
  catch (e) { return {}; }
}
function saveProgress(p) {
  try { localStorage.setItem("mandarin-progress", JSON.stringify(p)); } catch (e) {}
}
let progress = loadProgress();

function markDone(lessonId, part) {
  progress[lessonId] = progress[lessonId] || {};
  progress[lessonId][part] = true;
  saveProgress(progress);
}
function recordQuiz(lessonId, score, total) {
  progress[lessonId] = progress[lessonId] || {};
  const best = progress[lessonId].quizBest || 0;
  if (score >= best) progress[lessonId].quizBest = score;
  progress[lessonId].quizTotal = total;
  progress[lessonId].done = true;
  const today = new Date().toDateString();
  const s = progress.streak || { last: null, count: 0 };
  if (s.last !== today) {
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    s.count = (s.last === yesterday) ? s.count + 1 : 1;
    s.last = today;
  }
  progress.streak = s;
  saveProgress(progress);
}

/* ============================================================
   SPEECH — text-to-speech with Android quirk fixes
   ============================================================ */

let zhVoice = null;
function pickVoice() {
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  zhVoice = voices.find(v => /^zh([-_]CN)?/i.test(v.lang) && /CN|Mainland|普通话|Xiaoxiao|Yunxi|Google 普通话|Chinese/i.test(v.name + v.lang))
        || voices.find(v => /^zh/i.test(v.lang))
        || null;
  return voices;
}
if (window.speechSynthesis) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

let speakTimer = null;
function speak(text, rate, onend) {
  if (!window.speechSynthesis) { if (onend) onend(false); return; }
  speechSynthesis.cancel();
  clearTimeout(speakTimer);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  if (zhVoice) u.voice = zhVoice;
  u.rate = rate || 0.85;
  u.onend = () => { if (onend) onend(true); };
  u.onerror = () => { if (onend) onend(false); };
  speakTimer = setTimeout(() => {
    if (speechSynthesis.paused) speechSynthesis.resume();
  }, 150);
  speechSynthesis.speak(u);
}

function speakSlow(sylls, i) {
  i = i || 0;
  if (i >= sylls.length) return;
  speak(sylls[i], 0.5, () => {
    setTimeout(() => speakSlow(sylls, i + 1), 450);
  });
}

/* ============================================================
   SPEECH RECOGNITION — phrase pronunciation checking
   ============================================================ */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function listenFor(accept, ui) {
  if (!SR) {
    ui.onerror("This browser can't do speech recognition. On your phone, use Chrome — it has it built in.");
    return;
  }
  const rec = new SR();
  rec.lang = "zh-CN";
  rec.interimResults = true;
  rec.maxAlternatives = 5;
  let resolved = false, audioStarted = false, speechHeard = false;
  const heard = [];
  const clean = s => s.replace(/[，。？！?,.!\s]/g, "");
  const matches = t => {
    const c = clean(t);
    return c.length > 0 && accept.some(x => c === x || c.includes(x) || x.includes(c));
  };
  const display = () => {
    const m = heard.filter(matches);
    if (m.length) return m[m.length - 1];
    return heard.reduce((a, b) => (clean(b).length >= clean(a).length ? b : a), heard[0]);
  };
  const settle = () => {
    if (resolved) return;
    resolved = true;
    ui.onresult(heard.some(matches), display());
  };
  rec.onstart = ui.onstart;
  rec.onaudiostart = () => { audioStarted = true; };
  rec.onspeechstart = () => { speechHeard = true; if (ui.onhear) ui.onhear(); };
  rec.onresult = (e) => {
    let anyFinal = false;
    for (let i = 0; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) anyFinal = true;
      for (let j = 0; j < r.length; j++) {
        if (r[j].transcript && r[j].transcript.trim()) heard.push(r[j].transcript);
      }
    }
    if (anyFinal && heard.length) settle();
  };
  rec.onerror = (e) => {
    if (resolved) return;
    if (heard.length) { settle(); return; }
    resolved = true;
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      ui.onerror("The microphone was blocked. Tap the padlock next to the web address, set Microphone to Allow, then reload the page.");
    } else if (e.error === "no-speech") {
      ui.onerror("I didn't hear anything — tap the button and speak straight away, nice and clearly.");
    } else {
      ui.onerror("The microphone didn't start (" + e.error + "). Try again in a moment.");
    }
  };
  rec.onend = () => {
    if (resolved) return;
    if (heard.length) { settle(); return; }
    resolved = true;
    if (!audioStarted) {
      ui.onerror("The microphone never opened — reload the page and check the mic permission (padlock next to the address).");
    } else if (!speechHeard) {
      ui.onerror("The mic was on, but no speech reached it. The wrong microphone may be selected — run the 🎙️ Microphone check from the menu.");
    } else {
      ui.onerror("I heard your voice but couldn't make out the words — get a little closer and have another go!");
    }
  };
  try { rec.start(); } catch (err) {
    ui.onerror("Couldn't start listening — try again in a second.");
  }
  return rec;
}

/* ============================================================
   PITCH DETECTION — the tone meter (no speech recognition
   needed; one single "mah" is enough)
   ============================================================ */

function detectPitch(buf, sr) {
  let r0 = 0;
  for (let i = 0; i < buf.length; i++) r0 += buf[i] * buf[i];
  if (r0 < 1e-4) return null;
  const minLag = Math.floor(sr / 400), maxLag = Math.min(Math.floor(sr / 70), buf.length - 1);
  const nrAt = (lag) => {
    let r = 0;
    for (let i = 0; i < buf.length - lag; i += 2) r += buf[i] * buf[i + lag];
    return (2 * r) / r0;
  };
  let best = 0, bl = 0;
  for (let lag = minLag; lag <= maxLag; lag += 2) {
    const nr = nrAt(lag);
    if (nr > best) { best = nr; bl = lag; }
  }
  if (best < 0.45 || !bl) return null;
  // octave-error fix: prefer a submultiple lag (higher pitch) if nearly as good
  for (const k of [2, 3]) {
    const cand = Math.round(bl / k);
    if (cand >= minLag && nrAt(cand) > best * 0.85) { bl = cand; break; }
  }
  return sr / bl;
}

let meterCleanup = null;
function stopToneMeter() {
  if (meterCleanup) { meterCleanup(); meterCleanup = null; }
}

function runToneMeter(targetTone, ui) {
  // ui: {onlisten, onlevel? , onresult(detectedTone, userPathPoints), onerror(msg)}
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    ui.onerror("This browser can't open the microphone for the tone meter.");
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser();
    an.fftSize = 2048;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    const sr = ctx.sampleRate;
    const track = [];
    let started = 0, last = 0, raf = null, finished = false;
    const t0 = performance.now();
    const cleanup = () => {
      if (raf) cancelAnimationFrame(raf);
      stream.getTracks().forEach(t => t.stop());
      if (ctx.state !== "closed") ctx.close();
    };
    meterCleanup = () => { finished = true; cleanup(); };
    ui.onlisten();
    const finish = () => {
      if (finished) return;
      finished = true;
      cleanup();
      analyse();
    };
    const step = () => {
      if (finished) return;
      an.getFloatTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      const rms = Math.sqrt(sum / buf.length);
      const now = performance.now();
      if (rms > 0.02) {
        const f = detectPitch(buf, sr);
        if (f) {
          if (!started) started = now;
          last = now;
          track.push(f);
        }
      }
      if (started && (now - started > 2000 || (now - last > 500 && track.length > 6))) return finish();
      if (!started && now - t0 > 5000) {
        finished = true; cleanup();
        ui.onerror("I didn't hear anything — tap the button and say it straight away.");
        return;
      }
      raf = requestAnimationFrame(step);
    };
    step();

    function analyse() {
      if (track.length < 6) {
        ui.onerror("That was a bit too short for me to read — hold the sound a little longer, like \"maaah\".");
        return;
      }
      // to semitones, relative to median; reject octave-jump outliers; smooth
      let semis = track.map(f => 12 * Math.log2(f));
      const sorted = [...semis].sort((a, b) => a - b);
      const med = sorted[Math.floor(sorted.length / 2)];
      semis = semis.filter(v => Math.abs(v - med) < 10).map(v => v - med);
      if (semis.length < 6) { ui.onerror("I couldn't read the pitch clearly — try again, a touch louder."); return; }
      const sm = semis.map((v, i, a) => {
        const w = [a[i - 1], v, a[i + 1]].filter(x => x !== undefined);
        return w.reduce((x, y) => x + y, 0) / w.length;
      });
      const n = sm.length;
      const seg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
      const s = seg(sm.slice(0, Math.max(1, Math.floor(n * 0.25))));
      const e = seg(sm.slice(-Math.max(1, Math.floor(n * 0.25))));
      const midArr = sm.slice(Math.floor(n * 0.2), Math.ceil(n * 0.8));
      const m = Math.min(...midArr);
      const range = Math.max(...sm) - Math.min(...sm);
      let detected;
      if (s - m >= 1.5 && e - m >= 1.5) detected = 3;
      else if (e - s >= 1.8) detected = 2;
      else if (s - e >= 1.8) detected = 4;
      else if (range <= 2.2) detected = 1;
      else detected = 0;
      // build drawable points in the 120x85 curve box
      const lo = Math.min(...sm) - 0.5, hi = Math.max(...sm) + 0.5;
      const pts = sm.map((v, i) => {
        const x = 10 + 100 * (n === 1 ? 0.5 : i / (n - 1));
        const y = 75 - ((v - lo) / (hi - lo)) * 60;
        return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
      });
      ui.onresult(detected, pts);
    }
  }).catch((err) => {
    ui.onerror((err && err.name === "NotAllowedError")
      ? "The microphone was blocked — tap the padlock next to the address, allow the microphone, and reload."
      : "Couldn't open the microphone (" + (err && err.name) + ").");
  });
}

/* Tone chips */
function toneChip(pinyinSyll, tone) {
  const c = TONE_COLORS[tone];
  return `<div class="chip" style="background:${c}14;border:2px solid ${c}55">

}

function toneChips(p) {
  if (!p.ptones) return "";
  const written = p.psyll.map((s, i) => toneChip(s, p.ptones[i])).join("");

    <div class="chips-label">How it's really said:</div>
    <div class="tone-chips">${spoken}</div>
    <div class="sandhi">🤹 ${p.note}</div>`;
}

  wireTopbar();
  on("listen", () => speak(p.hanzi, 0.8));
  on("slow", () => speakSlow(p.syll));
  wireMic(p);
  on("back", () => i === 0 ? showTone(3) : showPhrase(i - 1));
  on("next", () => {
    if (i < n - 1) showPhrase(i + 1);
    else { markDone("lesson1", "phrases"); showSpeakIntro(); }
  });
}

/* ---------- Part 3: Speaking from memory ---------- */

function showSpeakIntro() {
  h(`
    ${topbar("Lesson 1 · Part 3 of 4")}
    ${bar(3, 4)}
    <h2>Part 3 — Say it from memory</h2>
    <p class="subtitle">Now the challenge: you'll see only the English and the pinyin. Say the phrase out loud and let the app check you. Peek with 🔊 if you're stuck — that's allowed!</p>
    <button class="big green" id="start">Start speaking practice →</button>
    <button class="big grey" id="back">← Back</button>
  `);
  wireTopbar();
  on("start", () => showSpeak(0));
  on("back", () => showPhrase(LESSONS[0].phrases.length - 1));
}

function showSpeak(i) {
  const p = LESSONS[0].phrases[i];
  const n = LESSONS[0].phrases.length;
  h(`
    ${topbar(`Lesson 1 · Part 3 · ${i + 1} / ${n}`)}
    ${bar(3, 4)}
    <h2>Say this in Mandarin:</h2>
    <div class="card center">
      <div class="english" style="font-size:24px;color:#33261d;font-weight:600">${p.english}</div>
      <div class="pinyin">${p.pinyin}</div>
      <div class="soundslike">🗣 "${p.phon}"</div>
    </div>
    ${micButton()}
    <button class="big outline" id="peek">🔊 Remind me how it sounds</button>
    <div class="btn-row">
      <button class="big grey" id="back">← Back</button>
      <button class="big green" id="next">${i < n - 1 ? "Next →" : "On to the quiz →"}</button>
    </div>
  `);
  wireTopbar();
  wireMic(p);
  on("peek", () => speak(p.hanzi, 0.8));
  on("back", () => i === 0 ? showSpeakIntro() : showSpeak(i - 1));
  on("next", () => {
    if (i < n - 1) showSpeak(i + 1);
    else { markDone("lesson1", "speaking"); showQuizIntro(); }
  });
}

/* ---------- Part 4: Quiz ---------- */

let quizScore = 0;

function showQuizIntro() {
  h(`
    ${topbar("Lesson 1 · Part 4 of 4")}
    ${bar(4, 4)}
    <h2>Part 4 — Quick quiz</h2>
    <p class="subtitle">8 questions: four listening (which tone did you hear?) and four meanings. Sound on!</p>
    <button class="big green" id="start">Start the quiz →</button>
    <button class="big grey" id="back">← Back</button>
  `);
  wireTopbar();
  on("start", () => { quizScore = 0; showQuiz(0); });
  on("back", () => showSpeak(LESSONS[0].phrases.length - 1));
}

function showQuiz(i) {
  const quiz = LESSONS[0].quiz;
  const q = quiz[i];
  const n = quiz.length;
  if (q.type === "tone") {
    h(`
      ${topbar(`Quiz · ${i + 1} / ${n}`)}
      ${bar(4, 4)}
      <h2>Question ${i + 1}</h2>
      <p class="subtitle">Listen, then choose: which tone did you hear?</p>
      <button class="big blue" id="play">🔊 Play the sound</button>
      <div id="opts">
        ${[1,2,3,4].map(t => `<button class="quiz-option" data-t="${t}">${curveSvg(t, 44)}<span>Tone ${t} — ${TONE_WORDS[t]}</span></button>`).join("")}
      </div>
      <div class="feedback" id="fb"></div>
      <button class="big green" id="next" disabled>${i < n - 1 ? "Next question →" : "See my score →"}</button>
    `);
    wireTopbar();
    on("play", () => speak(q.play, 0.7));
    document.querySelectorAll(".quiz-option").forEach(btn => {
      btn.onclick = () => {
        if (el("next").disabled === false) return;
        const chosen = Number(btn.dataset.t);
        const fb = el("fb");
        if (chosen === q.answer) {
          quizScore++;
          btn.classList.add("correct");
          fb.className = "feedback show good";
          fb.textContent = `✅ Right! That was ${q.pinyin} — tone ${q.answer}.`;
        } else {
          btn.classList.add("wrong");
          document.querySelector(`.quiz-option[data-t="${q.answer}"]`).classList.add("correct");
          fb.className = "feedback show bad";
          fb.textContent = `That was ${q.pinyin} — tone ${q.answer}, ${TONE_WORDS[q.answer]}. Tap 🔊 to hear it again before moving on.`;
        }
        el("next").disabled = false;
      };
    });
  } else {
    h(`
      ${topbar(`Quiz · ${i + 1} / ${n}`)}
      ${bar(4, 4)}
      <h2>Question ${i + 1}</h2>
      <p class="subtitle">${q.q}</p>
      <div id="opts">
        ${q.options.map((o, idx) => `<button class="quiz-option" data-i="${idx}"><span>${o}</span></button>`).join("")}
      </div>
      <div class="feedback" id="fb"></div>
      <button class="big green" id="next" disabled>${i < n - 1 ? "Next question →" : "See my score →"}</button>
    `);
    wireTopbar();
    document.querySelectorAll(".quiz-option").forEach(btn => {
      btn.onclick = () => {
        if (el("next").disabled === false) return;
        const chosen = Number(btn.dataset.i);
        const fb = el("fb");
        if (chosen === q.answer) {
          quizScore++;
          btn.classList.add("correct");
          fb.className = "feedback show good";
          fb.textContent = "✅ Correct!";
        } else {
          btn.classList.add("wrong");
          document.querySelector(`.quiz-option[data-i="${q.answer}"]`).classList.add("correct");
          fb.className = "feedback show bad";
          fb.textContent = `The answer is: ${q.options[q.answer]}`;
        }
        el("next").disabled = false;
      };
    });
  }
  on("next", () => {
    if (i < n - 1) showQuiz(i + 1);
    else showResults();
  });
}

function showResults() {
  const total = LESSONS[0].quiz.length;
  recordQuiz("lesson1", quizScore, total);
  const pct = quizScore / total;
  const msg = pct === 1 ? "Perfect score — 太好了 (tài hǎo le)! Brilliant!"
    : pct >= 0.75 ? "Great work — you've really got this!"
    : pct >= 0.5 ? "Good effort — worth one more run through the tones tomorrow."
    : "Tones are hard at first — everyone finds this bit tough. Run Part 1 again tomorrow and it will click.";
  const s = progress.streak;
  h(`
    ${topbar("Lesson 1 complete")}
    <div class="big-emoji">${pct >= 0.75 ? "🎉🐼🎉" : "💪🐼"}</div>
    <h2 class="center">You scored ${quizScore} / ${total}</h2>
    <p class="subtitle center">${msg}</p>
    ${s && s.count > 1 ? `<p class="streak">🔥 ${s.count}-day streak!</p>` : ""}
    <div class="card">
      <p><b>Today you learned:</b></p>
      <p style="margin-top:8px">The four tones · 你好 hello · 你好吗 how are you · 我很好 I'm well · 谢谢 thank you · 再见 goodbye</p>
    </div>
    <button class="big green" id="again">Practise again</button>
    <button class="big grey" id="home">← Back to menu</button>
    <p class="center" style="color:#a08872;font-size:15px;margin-top:14px">再见 — see you tomorrow! 👋</p>
  `);
  wireTopbar();
  on("again", showToneIntro);
  on("home", showHome);
}

/* ============================================================ */
showHome();

/* Offline support — lets the app install and open without internet */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
