<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ff6b6b">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<title>Mandarin with Claude</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent; }
  html { touch-action: manipulation; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #fff6e9 0%, #ffe9ef 45%, #e9f3ff 100%);
    background-attachment: fixed;
    color: #33261d;
    min-height: 100vh;
    font-size: 18px;
    line-height: 1.5;
  }
  #app { max-width: 520px; margin: 0 auto; padding: 16px 16px 40px; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0 14px;
  }
  .topbar .home-btn {
    background: #ffffffcc; border: none; font-size: 24px; cursor: pointer;
    padding: 6px 12px; border-radius: 12px; box-shadow: 0 2px 8px rgba(230,120,80,.15);
  }
  .topbar .crumb { font-size: 15px; color: #a08872; text-align: right; }

  h1, h2 { font-family: "Fredoka", "Segoe UI", sans-serif; letter-spacing: .2px; }
  h1 { font-size: 30px; margin-bottom: 4px; color: #e2504c; }
  h2 { font-size: 23px; margin-bottom: 10px; color: #7a4bbf; }
  .subtitle { color: #a08872; margin-bottom: 20px; font-size: 16px; }

  .card {
    background: #fffdf9;
    border-radius: 22px;
    padding: 20px;
    margin-bottom: 14px;
    box-shadow: 0 6px 20px rgba(235, 120, 90, .13);
  }

  .hanzi { font-size: 64px; text-align: center; line-height: 1.2; margin: 8px 0; }
  .hanzi-small { font-size: 40px; }
  .pinyin { font-size: 28px; text-align: center; color: #e2504c; font-weight: 700; margin-bottom: 2px;
            font-family: "Fredoka", sans-serif; }
  .soundslike { text-align: center; font-size: 17px; color: #1e9e63; font-weight: 600; margin-bottom: 4px; }
  .english { font-size: 19px; text-align: center; color: #7b6a58; margin-bottom: 10px; }

  button.big {
    display: block; width: 100%;
    min-height: 58px;
    font-size: 19px; font-weight: 600;
    font-family: "Fredoka", "Segoe UI", sans-serif;
    border: none; border-radius: 18px;
    cursor: pointer;
    margin: 10px 0;
    padding: 14px 18px;
    color: #fff;
    background: linear-gradient(135deg, #ff6b6b, #ff9e5e);
    box-shadow: 0 4px 12px rgba(255, 197, 138, .5);
    transition: transform .06s;
  }
  button.big:active { transform: scale(.97); }
  button.big.green  { background: linear-gradient(135deg, #43c76b, #1e9e63); box-shadow: 0 4px 12px rgba(120,210,150,.45); }
  button.big.blue   { background: linear-gradient(135deg, #4aa8f7, #3b6fd4); box-shadow: 0 4px 12px rgba(140,180,245,.45); }
  button.big.teal   { background: linear-gradient(135deg, #2bd4a7, #14a0a0); box-shadow: 0 4px 12px rgba(120,220,200,.45); }
  button.big.amber  { background: linear-gradient(135deg, #ffb84d, #ff7a59); box-shadow: 0 4px 12px rgba(255,190,120,.5); }
  button.big.purple { background: linear-gradient(135deg, #a06ee0, #7a4bbf); box-shadow: 0 4px 12px rgba(180,150,230,.45); }
  button.big.grey   { background: #ffffffd9; color: #7b6a58; box-shadow: 0 2px 8px rgba(200,160,120,.2); font-weight: 500; }
  button.big.outline {
    background: #fffdf9; color: #e2504c; border: 2px solid #ffb1a8; box-shadow: none;
  }
  button.big:disabled { opacity: .45; cursor: default; }

  .btn-row { display: flex; gap: 10px; }
  .btn-row button.big { flex: 1; }

  .progressbar {
    height: 10px; background: #ffffffb0; border-radius: 6px; margin-bottom: 18px; overflow: hidden;
    box-shadow: inset 0 1px 3px rgba(200,150,110,.25);
  }
  .progressbar > div { height: 100%; background: linear-gradient(90deg, #ff6b6b, #ffb84d); border-radius: 6px; transition: width .3s; }

  .feedback {
    border-radius: 14px; padding: 14px 16px; margin-top: 12px; font-size: 17px;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.good { background: #e2f8e7; color: #1d6e33; }
  .feedback.bad  { background: #ffe9e6; color: #a03028; }
  .feedback.info { background: #e7f1fd; color: #2a5aa8; }
  .fb-row { display: flex; gap: 8px; margin: 10px 0 4px; }
  .fb-row button {
    flex: 1; min-height: 44px; font-size: 15px; font-weight: 600; color: #fff;
    border: none; border-radius: 12px; cursor: pointer;
    background: linear-gradient(135deg, #4aa8f7, #3b6fd4);
  }

  .tone-svg { display: block; margin: 0 auto 6px; }

  .tone-chips { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin: 6px 0 4px; }
  .chips-label { text-align: center; font-size: 14px; color: #a08872; margin-top: 8px; }
  .chip {
    border-radius: 14px; padding: 8px 12px; text-align: center; min-width: 78px;
    background: #fff;
  }
  .chip svg { display: block; margin: 0 auto 2px; }
  .chip .chip-p { font-weight: 700; font-size: 17px; font-family: "Fredoka", sans-serif; }
  .chip .chip-t { font-size: 13px; font-weight: 600; }

  .sandhi {
    font-size: 15px; color: #6b4d8a; background: #f3ecfd; border-radius: 14px;
    padding: 12px 14px; margin-top: 10px; text-align: left;
  }

  .lesson-item {
    display: flex; align-items: center; gap: 14px;
    background: #fffdf9; border-radius: 20px;
    padding: 18px; margin-bottom: 12px; cursor: pointer;
    box-shadow: 0 5px 16px rgba(235, 120, 90, .13);
  }
  .lesson-item .num {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, #ff6b6b, #ffb84d);
    color: #fff; font-size: 21px; font-weight: 700;
    font-family: "Fredoka", sans-serif;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .lesson-item.locked { opacity: .55; cursor: default; box-shadow: none; background: #fffdf9aa; }
  .lesson-item.locked .num { background: #d8c8b4; }
  .lesson-item .info { flex: 1; }
  .lesson-item .info .t { font-weight: 600; font-size: 18px; font-family: "Fredoka", sans-serif; }
  .lesson-item .info .d { font-size: 15px; color: #a08872; }
  .lesson-item .done-tick { font-size: 22px; }

  .streak {
    text-align: center; font-size: 16px; color: #b25b3a; margin: 0 auto 18px;
    background: #fff3dd; border-radius: 999px; padding: 8px 18px; width: fit-content;
    box-shadow: 0 2px 8px rgba(240,180,120,.25);
  }
  .quiz-option {
    display: flex; align-items: center; gap: 12px; width: 100%;
    min-height: 54px; font-size: 18px;
    background: #fffdf9; border: 2px solid #f2dfc8; border-radius: 16px;
    margin: 8px 0; padding: 10px 16px; cursor: pointer; text-align: left;
    color: #33261d; font-family: "Segoe UI", sans-serif;
  }
  .quiz-option svg { flex-shrink: 0; }
  .quiz-option.correct { background: #e2f8e7; border-color: #43c76b; }
  .quiz-option.wrong   { background: #ffe9e6; border-color: #ff6b6b; }
  .diag { font-size: 15px; color: #7b6a58; margin-top: 10px; white-space: pre-line; }
  .tip {
    background: #fff3dd; border-radius: 16px;
    padding: 12px 14px; font-size: 15px; color: #8a6335; margin-top: 16px;
  }
  .center { text-align: center; }
  .big-emoji { font-size: 60px; text-align: center; margin: 10px 0; }
  .meter-box { text-align: center; margin-top: 10px; display: none; }
  .meter-box .legend { font-size: 14px; color: #a08872; }
  .numgrid { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 10px 0; }
  .numgrid .n {
    background: #fff; border-radius: 12px; padding: 8px 12px; font-size: 20px;
    box-shadow: 0 2px 6px rgba(230,150,100,.18); font-family: "Fredoka", sans-serif;
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";

/* ============================================================
   TONE COLOURS & LABELS
   ============================================================ */

const TONE_COLORS = { 0: "#8d8d94", 1: "#e53935", 2: "#1e9e63", 3: "#3b6fd4", 4: "#8e44ad" };
const TONE_LABELS = { 0: "light ·", 1: "1st · flat →", 2: "2nd · rise ↗", 3: "3rd · dip ↓↑", 4: "4th · fall ↘" };
const TONE_WORDS  = { 0: "light and quick", 1: "high and flat", 2: "rising", 3: "dipping down then up", 4: "falling sharply" };

const TONE_PATHS = {
  1: "M10,30 L110,30",
  2: "M10,55 L110,15",
  3: "M10,35 Q55,75 70,55 T110,20",
  4: "M10,15 L110,70"
};

function curveSvg(tone, w, dashed) {
  const color = TONE_COLORS[tone];
  const inner = tone === 0
    ? `<circle cx="60" cy="55" r="9" fill="${color}"/>`
    : `<path d="${TONE_PATHS[tone]}" stroke="${color}" stroke-width="9" fill="none" stroke-linecap="round"${dashed ? ' stroke-dasharray="14 10"' : ""}/>`;
  return `<svg width="${w}" height="${Math.round(w * 0.71)}" viewBox="0 0 120 85">${inner}</svg>`;
}

/* ============================================================
   DATA
   ============================================================ */

const TONES = [
  { n: 1, name: "First tone — high and flat",
    hanzi: "妈", pinyin: "mā", phon: "mah", meaning: "mother",
    desc: "Hold your voice high and level, like singing one steady note: maaa." },
  { n: 2, name: "Second tone — rising",
    hanzi: "麻", pinyin: "má", phon: "mah?", meaning: "hemp / numb",
    desc: "Rise from the middle upwards, like asking a question: ma?" },
  { n: 3, name: "Third tone — dip down, then up",
    hanzi: "马", pinyin: "mǎ", phon: "ma-ah", meaning: "horse",
    desc: "Start mid, dip low, then rise. Like a doubtful \"we-ell...\" This is the tricky one!" },
  { n: 4, name: "Fourth tone — sharp fall",
    hanzi: "骂", pinyin: "mà", phon: "mah!", meaning: "to scold",
    desc: "Drop sharply from high to low, like a firm \"No!\"" }
];

const LESSON1_PHRASES = [
  { hanzi: "你好", pinyin: "nǐ hǎo", english: "Hello", phon: "nee-how",
    syll: ["你", "好"], psyll: ["nǐ", "hǎo"], ptones: [3, 3],
    accept: ["你好", "妳好"], speak: true,
    spoken: { psyll: ["ní", "hǎo"], ptones: [2, 3] },
    note: "Two dips in a row is awkward to say, so Chinese speakers turn the first into a rise. Say it like <b>\"nee?\"</b> (rising, as if asking a question) then <b>\"how\"</b> (dipping). The 🔊 button says it this natural way." },
  { hanzi: "你好吗？", pinyin: "nǐ hǎo ma?", english: "How are you?", phon: "nee-how-mah",
    syll: ["你", "好", "吗"], psyll: ["nǐ", "hǎo", "ma"], ptones: [3, 3, 0],
    accept: ["你好吗", "你好嗎"], speak: true,
    spoken: { psyll: ["ní", "hǎo", "ma"], ptones: [2, 3, 0] },
    note: "Same trick as 你好: say <b>\"nee?\"</b> (rising) then <b>\"how\"</b> (dipping), and tack a quick light <b>\"mah\"</b> on the end." },
  { hanzi: "我很好", pinyin: "wǒ hěn hǎo", english: "I'm very well", phon: "wor-hun-how",
    syll: ["我", "很", "好"], psyll: ["wǒ", "hěn", "hǎo"], ptones: [3, 3, 3],
    accept: ["我很好"], speak: true,
    spoken: { psyll: ["wó", "hén", "hǎo"], ptones: [2, 2, 3] },
    note: "Three dips in a row — nobody says that! The first two become rises: <b>\"wor?\"</b> <b>\"hun?\"</b> (both rising) then <b>\"how\"</b> (dipping on the last one only)." },
  { hanzi: "谢谢", pinyin: "xièxie", english: "Thank you", phon: "shyeh-shyeh",
    syll: ["谢", "谢"], psyll: ["xiè", "xie"], ptones: [4, 0],
    accept: ["谢谢", "謝謝"], speak: true },
  { hanzi: "再见", pinyin: "zàijiàn", english: "Goodbye", phon: "dzeye-jyen",
    syll: ["再", "见"], psyll: ["zài", "jiàn"], ptones: [4, 4],
    accept: ["再见", "再見"], speak: true }
];

/* accept lists include digits and common same-sounding characters —
   recognisers rarely choose the number character for one lone syllable */
const LESSON2_NUMBERS = [
  { hanzi: "零", pinyin: "líng", english: "zero — 0", phon: "ling",
    syll: ["零"], psyll: ["líng"], ptones: [2], accept: ["零", "0", "玲", "铃", "灵"] },
  { hanzi: "一", pinyin: "yī", english: "one — 1", phon: "ee",

  { hanzi: "二", pinyin: "èr", english: "two — 2", phon: "ar",

  { hanzi: "四", pinyin: "sì", english: "four — 4", phon: "suh",

  { hanzi: "五", pinyin: "wǔ", english: "five — 5", phon: "woo",

  { hanzi: "八", pinyin: "bā", english: "eight — 8", phon: "bah",

  { hanzi: "九", pinyin: "jiǔ", english: "nine — 9", phon: "jyoh",
    syll: ["九"], psyll: ["jiǔ"], ptones: [3], accept: ["九", "9", "酒", "久", "就", "旧"] },
  { hanzi: "十", pinyin: "shí", english: "ten — 10", phon: "shr",
    syll: ["十"], psyll: ["shí"], ptones: [2], accept: ["十", "10", "时", "石", "食", "识", "是"] }
];

const LESSON2_PHRASES = [
  { hanzi: "我叫莎拉", pinyin: "wǒ jiào Shālā", english: "My name is Sara", phon: "wor jyaow shah-lah",
    syll: ["我", "叫", "莎", "拉"], psyll: ["wǒ", "jiào", "Shā", "lā"], ptones: [3, 4, 1, 1],
    accept: ["我叫"], speak: true,
    note: "叫 (jiào) means \"to be called\". Swap 莎拉 for your own name — Western names are usually kept as they are, so <b>\"wǒ jiào Sara\"</b> is perfect. The checker listens for the \"wǒ jiào…\" part." },
  { hanzi: "你叫什么名字？", pinyin: "nǐ jiào shénme míngzi?", english: "What's your name?", phon: "nee jyaow shun-muh ming-dzuh",
    syll: ["你", "叫", "什", "么", "名", "字"], psyll: ["nǐ", "jiào", "shén", "me", "míng", "zi"], ptones: [3, 4, 2, 0, 2, 0],
    accept: ["你叫什么名字", "叫什么名字", "你叫什么"], speak: true },
  { hanzi: "我是英国人", pinyin: "wǒ shì Yīngguó rén", english: "I'm British", phon: "wor shr ying-gwor run",
    syll: ["我", "是", "英", "国", "人"], psyll: ["wǒ", "shì", "Yīng", "guó", "rén"], ptones: [3, 4, 1, 2, 2],
    accept: ["我是英国人", "英国人"], speak: true },
  { hanzi: "很高兴认识你", pinyin: "hěn gāoxìng rènshi nǐ", english: "Lovely to meet you", phon: "hun gaow-shing run-shr nee",
    syll: ["很", "高", "兴", "认", "识", "你"], psyll: ["hěn", "gāo", "xìng", "rèn", "shi", "nǐ"], ptones: [3, 1, 4, 4, 0, 3],
    accept: ["很高兴认识你", "高兴认识你", "认识你"], speak: true }
];

const LESSON3_FAMILY = [
  { hanzi: "儿子", pinyin: "érzi", english: "son", phon: "ar-dzuh",
    syll: ["儿", "子"], psyll: ["ér", "zi"], ptones: [2, 0], accept: ["儿子"] },
  { hanzi: "女儿", pinyin: "nǚ'ér", english: "daughter", phon: "nyoo-ar",
    syll: ["女", "儿"], psyll: ["nǚ", "ér"], ptones: [3, 2], accept: ["女儿"] },
  { hanzi: "丈夫", pinyin: "zhàngfu", english: "husband", phon: "jahng-foo",
    syll: ["丈", "夫"], psyll: ["zhàng", "fu"], ptones: [4, 0], accept: ["丈夫"] },
  { hanzi: "妻子", pinyin: "qīzi", english: "wife", phon: "chee-dzuh",
    syll: ["妻", "子"], psyll: ["qī", "zi"], ptones: [1, 0], accept: ["妻子"] },
  { hanzi: "妈妈", pinyin: "māma", english: "mum", phon: "mah-mah",
    syll: ["妈", "妈"], psyll: ["mā", "ma"], ptones: [1, 0], accept: ["妈妈", "媽媽"] },
  { hanzi: "爸爸", pinyin: "bàba", english: "dad", phon: "bah-bah",
    syll: ["爸", "爸"], psyll: ["bà", "ba"], ptones: [4, 0], accept: ["爸爸"] },
  { hanzi: "家", pinyin: "jiā", english: "family / home", phon: "jyah",
    syll: ["家"], psyll: ["jiā"], ptones: [1], accept: ["家"] }
];

const LESSON3_PHRASES = [
  { hanzi: "这是我丈夫", pinyin: "zhè shì wǒ zhàngfu", english: "This is my husband", phon: "juh shr wor jahng-foo",

    note: "这是 (zhè shì) = \"this is\" — the all-purpose way to introduce anyone. Point politely and swap the last word: 这是我儿子, 这是我妈妈…" },
  { hanzi: "我有一个儿子", pinyin: "wǒ yǒu yí ge érzi", english: "I have one son", phon: "wor yoh ee-guh ar-dzuh",
    syll: ["我", "有", "一", "个", "儿", "子"], psyll: ["wǒ", "yǒu", "yí", "ge", "ér", "zi"], ptones: [3, 3, 2, 0, 2, 0],
    accept: ["我有一个儿子", "有一个儿子"], speak: true,
    spoken: { psyll: ["wó", "yǒu", "yí", "ge", "ér", "zi"], ptones: [2, 3, 2, 0, 2, 0] },
    note: "Our old friend the double-dip: 我有 is two 3rd tones, so say <b>\"wor?\"</b> (rising) then <b>\"yoh\"</b> (dipping)." },
  { hanzi: "我儿子住在杭州", pinyin: "wǒ érzi zhù zài Hángzhōu", english: "My son lives in Hangzhou", phon: "wor ar-dzuh joo dzeye hahng-joe",
    syll: ["我", "儿", "子", "住", "在", "杭", "州"], psyll: ["wǒ", "ér", "zi", "zhù", "zài", "Háng", "zhōu"], ptones: [3, 2, 0, 4, 4, 2, 1],
    accept: ["儿子住在杭州", "住在杭州"], speak: true,
    note: "住在 (zhù zài) = \"lives in\". You'll use this constantly — swap the city for anywhere: 住在昆明, 住在英国." },
  { hanzi: "他叫马丁", pinyin: "tā jiào Mǎdīng", english: "His name is Martin", phon: "tah jyaow mah-ding",
    syll: ["他", "叫", "马", "丁"], psyll: ["tā", "jiào", "Mǎ", "dīng"], ptones: [1, 4, 3, 1],

    note: "他 (tā) = he, 她 (also tā!) = she — they sound identical, only the writing differs. 马丁 (Mǎdīng) is how Chinese renders \"Martin\" — yes, it starts with the horse character!" }
];

const LESSON4_NUMBERS = [
  { hanzi: "十一", pinyin: "shíyī", english: "eleven — 11 (ten-one!)", phon: "shr-ee",
    syll: ["十", "一"], psyll: ["shí", "yī"], ptones: [2, 1], accept: ["十一", "11"],
    note: "Numbers stack logically: 11 is \"ten-one\", 12 \"ten-two\", 20 \"two-ten\", 25 \"two-ten-five\". Learn 0–10 and you can build every number to 99!" },
  { hanzi: "二十", pinyin: "èrshí", english: "twenty — 20 (two-ten)", phon: "ar-shr",

function pinyinFor(str) {
  const clean = String(str).replace(/[，。？！?,.!\s]/g, "");
  const parts = [];
  for (const ch of clean) parts.push(PINYIN[ch] || (/[0-9a-zA-Z]/.test(ch) ? ch : "?"));
  return parts.join(" ");
}

/* ============================================================
   PROGRESS
   ============================================================ */

function loadProgress() {
  let p;
  try { p = JSON.parse(localStorage.getItem("mandarin-progress")) || {}; }
  catch (e) { p = {}; }
  // migrate: earlier versions had no "passed" flag
  for (const l of LESSONS) {
    const lp = p[l.id];
    if (lp && lp.quizTotal && lp.quizBest / lp.quizTotal >= PASS_RATE) lp.passed = true;
  }
  p.mistakes = p.mistakes || {};
  return p;
}
function saveProgress(p) {
  try { localStorage.setItem("mandarin-progress", JSON.stringify(p)); } catch (e) {}
}
let progress = loadProgress();

function markDone(lessonId, part) {
  progress[lessonId] = progress[lessonId] || {};
  progress[lessonId][part] = true;
  saveProgress(progress);
}
function bumpStreak() {
  const today = new Date().toDateString();
  const s = progress.streak || { last: null, count: 0 };
  if (s.last !== today) {
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    s.count = (s.last === yesterday) ? s.count + 1 : 1;
    s.last = today;
  }
  progress.streak = s;
}
function recordQuiz(lessonId, score, total) {
  progress[lessonId] = progress[lessonId] || {};
  const lp = progress[lessonId];
  if (score >= (lp.quizBest || 0)) lp.quizBest = score;
  lp.quizTotal = total;
  lp.done = true;
  const newlyPassed = !lp.passed && score / total >= PASS_RATE;
  if (score / total >= PASS_RATE) lp.passed = true;
  bumpStreak();
  saveProgress(progress);
  return newlyPassed;
}
function recordReview(score, total) {
  if (score >= (progress.reviewBest || 0)) progress.reviewBest = score;
  bumpStreak();
  saveProgress(progress);
}
function noteMistake(qid, wasWrong) {
  const m = progress.mistakes;
  if (wasWrong) m[qid] = (m[qid] || 0) + 1;
  else if (m[qid]) m[qid] = m[qid] - 1;
  saveProgress(progress);
}
function lessonUnlocked(i) {
  if (i === 0) return true;
  const prev = progress[LESSONS[i - 1].id];
  return !!(prev && prev.passed);
}

/* ============================================================
   SPEECH — text-to-speech
   ============================================================ */

let zhVoice = null;
function pickVoice() {
  const voices = window.speechSynthesis ? speechSynthesis.getVoices() : [];
  zhVoice = voices.find(v => /^zh([-_]CN)?/i.test(v.lang) && /CN|Mainland|普通话|Xiaoxiao|Yunxi|Google 普通话|Chinese/i.test(v.name + v.lang))
        || voices.find(v => /^zh/i.test(v.lang))
        || null;
  return voices;
}
if (window.speechSynthesis) {
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

let speakTimer = null;
function speak(text, rate, onend) {
  if (!window.speechSynthesis) { if (onend) onend(false); return; }
  speechSynthesis.cancel();
  clearTimeout(speakTimer);
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  if (zhVoice) u.voice = zhVoice;
  u.rate = rate || 0.85;
  u.onend = () => { if (onend) onend(true); };
  u.onerror = () => { if (onend) onend(false); };
  speakTimer = setTimeout(() => {
    if (speechSynthesis.paused) speechSynthesis.resume();
  }, 150);
  speechSynthesis.speak(u);
}

function speakSlow(sylls, i) {
  i = i || 0;
  if (i >= sylls.length) return;
  speak(sylls[i], 0.5, () => {
    setTimeout(() => speakSlow(sylls, i + 1), 450);
  });
}

/* ============================================================
   SPEECH RECOGNITION
   accept: array of strings OR a function(cleanedString) => bool
   ============================================================ */

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

function listenFor(accept, ui) {
  if (!SR) {
    ui.onerror("This browser can't do speech recognition. On your phone, use Chrome — it has it built in.");
    return;
  }
  const rec = new SR();
  rec.lang = "zh-CN";
  rec.interimResults = true;
  rec.maxAlternatives = 5;
  let resolved = false, audioStarted = false, speechHeard = false;
  // record the learner's actual voice alongside recognition, so
  // feedback can play back what they really said
  let recorder = null, recChunks = [], recStream = null, recUrl = null;
  const stopRec = (cb) => {
    if (!recorder || recorder.state === "inactive") {
      if (recStream) recStream.getTracks().forEach(t => t.stop());
      cb(); return;
    }
    recorder.onstop = () => {
      try {
        const blob = new Blob(recChunks, { type: recorder.mimeType || "audio/webm" });
        if (blob.size > 200) {
          if (window._lastRecUrl) { try { URL.revokeObjectURL(window._lastRecUrl); } catch (e) {} }
          recUrl = URL.createObjectURL(blob);
          window._lastRecUrl = recUrl;
        }
      } catch (e) {}
      recStream.getTracks().forEach(t => t.stop());
      cb();
    };
    try { recorder.stop(); } catch (e) {
      recStream.getTracks().forEach(t => t.stop());
      cb();
    }
  };
  const heard = [];
  const clean = s => s.replace(/[，。？！?,.!\s]/g, "");
  const matches = t => {
    const c = clean(t);
    if (!c.length) return false;
    if (typeof accept === "function") return accept(c);
    return accept.some(x => c === x || c.includes(x) || x.includes(c));
  };
  const display = () => {
    const m = heard.filter(matches);
    if (m.length) return m[m.length - 1];
    return heard.reduce((a, b) => (clean(b).length >= clean(a).length ? b : a), heard[0]);
  };
  let watchdog = null;
  const settle = () => {
    if (resolved) return;
    resolved = true;
    clearTimeout(watchdog);
    stopRec(() => ui.onresult(heard.some(matches), display(), recUrl));
  };
  const fail = (msg) => {
    if (resolved) return;
    resolved = true;
    clearTimeout(watchdog);
    stopRec(() => ui.onerror(msg));
  };
  rec.onstart = ui.onstart;
  rec.onaudiostart = () => { audioStarted = true; };
  rec.onspeechstart = () => { speechHeard = true; if (ui.onhear) ui.onhear(); };
  rec.onresult = (e) => {
    let anyFinal = false;
    for (let i = 0; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) anyFinal = true;
      for (let j = 0; j < r.length; j++) {
        if (r[j].transcript && r[j].transcript.trim()) heard.push(r[j].transcript);
      }
    }
    if (anyFinal && heard.length) settle();
  };
  rec.onerror = (e) => {
    if (resolved) return;
    if (heard.length) { settle(); return; }
    if (e.error === "not-allowed" || e.error === "service-not-allowed") {
      fail("The microphone was blocked. Tap the padlock next to the web address, set Microphone to Allow, then reload the page.");
    } else if (recorder && (e.error === "no-speech" || e.error === "audio-capture" || e.error === "aborted")) {
      recConflict();
    } else if (e.error === "no-speech") {
      fail("I didn't hear anything — tap the button and speak straight away, nice and clearly.");
    } else {
      fail("The microphone didn't start (" + e.error + "). Try again in a moment.");
    }
  };
  const recConflict = () => {
    // the recorder starved the recogniser of audio — remember to
    // never run them in parallel on this device again
    try { localStorage.setItem("mandarin-norec", "1"); } catch (e) {}
    fail("The voice recorder was hogging your microphone, so I've switched it off on this device — tap 🎤 and try once more. (A 🎧 record button will appear in the feedback instead.)");
  };
  rec.onend = () => {
    if (resolved) return;
    if (heard.length) { settle(); return; }
    if (recorder) { recConflict(); return; }
    if (!audioStarted) {
      fail("The microphone never opened — reload the page and check the mic permission (padlock next to the address).");
    } else if (!speechHeard) {
      fail("The mic was on, but no speech reached it. The wrong microphone may be selected — run the 🎙️ Microphone check from the menu.");
    } else {
      fail("I heard your voice but couldn't make out the words — say it a few times in one breath and have another go!");
    }
  };
  const begin = () => {
    try { rec.start(); } catch (err) {
      fail("Couldn't start listening — try again in a second.");
      return;
    }
    // hard time limit: the listener must never hang the screen
    watchdog = setTimeout(() => {
      if (resolved) return;
      try { rec.abort(); } catch (e) {}
      if (heard.length) settle();
      else if (recorder) recConflict();
      else fail("The listener got stuck — tap 🎤 and have another go.");
    }, 10000);
  };
  // best-effort recorder; recognition proceeds either way. Skipped
  // entirely on devices where the two have fought over the mic.
  let parallelRecOk = true;
  try { parallelRecOk = localStorage.getItem("mandarin-norec") !== "1"; } catch (e) {}
  if (parallelRecOk && window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: true }).then((s) => {
      recStream = s;
      try {
        recorder = new MediaRecorder(s);
        recorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
        recorder.start();
      } catch (e) {
        s.getTracks().forEach(t => t.stop());
        recStream = null; recorder = null;
      }
      begin();
    }).catch(begin);
  } else {
    begin();
  }
  return rec;
}

/* ============================================================
   PITCH DETECTION — the tone meter
   ============================================================ */

function detectPitch(buf, sr) {
  let r0 = 0;
  for (let i = 0; i < buf.length; i++) r0 += buf[i] * buf[i];
  if (r0 < 1e-4) return null;
  const minLag = Math.floor(sr / 400), maxLag = Math.min(Math.floor(sr / 70), buf.length - 1);
  const nrAt = (lag) => {
    let r = 0;
    for (let i = 0; i < buf.length - lag; i += 2) r += buf[i] * buf[i + lag];
    return (2 * r) / r0;
  };
  let best = 0, bl = 0;
  for (let lag = minLag; lag <= maxLag; lag += 2) {
    const nr = nrAt(lag);
    if (nr > best) { best = nr; bl = lag; }
  }
  if (best < 0.45 || !bl) return null;
  for (const k of [2, 3]) {
    const cand = Math.round(bl / k);
    if (cand >= minLag && nrAt(cand) > best * 0.85) { bl = cand; break; }
  }
  return sr / bl;
}

let meterCleanup = null;
function stopToneMeter() {
  if (meterCleanup) { meterCleanup(); meterCleanup = null; }
}

/* Standalone voice recorder (no speech recognition running) —
   used on devices where recorder + recogniser can't share the mic.
   done(url, errMsg): url is a playable blob URL or null. */
function recordClip(done) {
  if (!(window.MediaRecorder && navigator.mediaDevices && navigator.mediaDevices.getUserMedia)) {
    done(null, "Recording isn't supported in this browser.");
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
    const rec = new MediaRecorder(stream);
    const chunks = [];
    rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser();
    an.fftSize = 512;
    src.connect(an);
    const data = new Uint8Array(an.fftSize);
    let raf = null, started = 0, last = 0;
    const t0 = performance.now();
    const stopAll = (cb) => {
      if (raf) cancelAnimationFrame(raf);
      rec.onstop = () => {
        let url = null;
        try {
          const blob = new Blob(chunks, { type: rec.mimeType || "audio/webm" });
          if (blob.size > 200) {
            if (window._lastRecUrl) { try { URL.revokeObjectURL(window._lastRecUrl); } catch (e) {} }
            url = URL.createObjectURL(blob);
            window._lastRecUrl = url;
          }
        } catch (e) {}
        stream.getTracks().forEach(t => t.stop());
        if (ctx.state !== "closed") ctx.close();
        cb(url);
      };
      try { rec.stop(); } catch (e) {
        stream.getTracks().forEach(t => t.stop());
        if (ctx.state !== "closed") ctx.close();
        cb(null);
      }
    };
    rec.start();
    const loop = () => {
      an.getByteTimeDomainData(data);
      let s = 0;
      for (let i = 0; i < data.length; i++) { const d = (data[i] - 128) / 128; s += d * d; }
      const rms = Math.sqrt(s / data.length);
      const now = performance.now();
      if (rms > 0.04) { if (!started) started = now; last = now; }
      if (started && (now - started > 4000 || now - last > 800)) {
        stopAll(url => done(url, url ? null : "The recording came out empty — have another go."));
        return;
      }
      if (!started && now - t0 > 5000) {
        stopAll(() => done(null, "I didn't hear anything — tap and speak straight away."));
        return;
      }
      raf = requestAnimationFrame(loop);
    };
    loop();
  }).catch(() => done(null, "The microphone was blocked — check the padlock permissions."));
}

function runToneMeter(targetTone, ui) {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    ui.onerror("This browser can't open the microphone for the tone meter.");
    return;
  }
  navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser();
    an.fftSize = 2048;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    const sr = ctx.sampleRate;
    const track = [];
    let started = 0, last = 0, raf = null, finished = false;
    const t0 = performance.now();
    // record the attempt so the learner can play their own voice back
    let recorder = null, recChunks = [], recUrl = null;
    try {
      if (window.MediaRecorder) {
        recorder = new MediaRecorder(stream);
        recorder.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
        recorder.start();
      }
    } catch (e) { recorder = null; }
    const stopRec = (cb) => {
      if (!recorder || recorder.state === "inactive") { cb(); return; }
      recorder.onstop = () => {
        try {
          const blob = new Blob(recChunks, { type: recorder.mimeType || "audio/webm" });
          if (blob.size > 200) {
            if (window._lastToneRecUrl) { try { URL.revokeObjectURL(window._lastToneRecUrl); } catch (e) {} }
            recUrl = URL.createObjectURL(blob);
            window._lastToneRecUrl = recUrl;
          }
        } catch (e) {}
        cb();
      };
      try { recorder.stop(); } catch (e) { cb(); }
    };
    const cleanup = () => {
      if (raf) cancelAnimationFrame(raf);
      stream.getTracks().forEach(t => t.stop());
      if (ctx.state !== "closed") ctx.close();
    };
    meterCleanup = () => { finished = true; try { if (recorder && recorder.state !== "inactive") recorder.stop(); } catch (e) {} cleanup(); };
    ui.onlisten();
    const finish = () => {
      if (finished) return;
      finished = true;
      if (raf) cancelAnimationFrame(raf);
      stopRec(() => { cleanup(); analyse(); });
    };
    const step = () => {
      if (finished) return;
      an.getFloatTimeDomainData(buf);
      let sum = 0;
      for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
      const rms = Math.sqrt(sum / buf.length);
      const now = performance.now();
      if (rms > 0.02) {
        const f = detectPitch(buf, sr);
        if (f) {
          if (!started) started = now;
          last = now;
          track.push(f);
        }
      }
      if (started && (now - started > 2000 || (now - last > 500 && track.length > 6))) return finish();
      if (!started && now - t0 > 5000) {
        finished = true; cleanup();
        ui.onerror("I didn't hear anything — tap the button and say it straight away.");
        return;
      }
      raf = requestAnimationFrame(step);
    };
    step();

    function analyse() {
      if (track.length < 6) {
        ui.onerror("That was a bit too short for me to read — hold the sound a little longer, like \"maaah\".");
        return;
      }
      let semis = track.map(f => 12 * Math.log2(f));
      const sorted = [...semis].sort((a, b) => a - b);
      const med = sorted[Math.floor(sorted.length / 2)];
      semis = semis.filter(v => Math.abs(v - med) < 10).map(v => v - med);
      if (semis.length < 6) { ui.onerror("I couldn't read the pitch clearly — try again, a touch louder."); return; }
      const sm = semis.map((v, i, a) => {
        const w = [a[i - 1], v, a[i + 1]].filter(x => x !== undefined);
        return w.reduce((x, y) => x + y, 0) / w.length;
      });
      const n = sm.length;
      const seg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
      const s = seg(sm.slice(0, Math.max(1, Math.floor(n * 0.25))));
      const e = seg(sm.slice(-Math.max(1, Math.floor(n * 0.25))));
      const midArr = sm.slice(Math.floor(n * 0.2), Math.ceil(n * 0.8));
      const m = Math.min(...midArr);
      const range = Math.max(...sm) - Math.min(...sm);
      let detected;
      if (s - m >= 1.5 && e - m >= 1.5) detected = 3;
      else if (e - s >= 1.8) detected = 2;
      else if (s - e >= 1.8) detected = 4;
      else if (range <= 2.2) detected = 1;
      else detected = 0;
      const lo = Math.min(...sm) - 0.5, hi = Math.max(...sm) + 0.5;
      const pts = sm.map((v, i) => {
        const x = 10 + 100 * (n === 1 ? 0.5 : i / (n - 1));
        const y = 75 - ((v - lo) / (hi - lo)) * 60;
        return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
      });
      ui.onresult(detected, pts, recUrl);
    }
  }).catch((err) => {
    ui.onerror((err && err.name === "NotAllowedError")
      ? "The microphone was blocked — tap the padlock next to the address, allow the microphone, and reload."
      : "Couldn't open the microphone (" + (err && err.name) + ").");
  });
}

/* ============================================================
   VIEW HELPERS
   ============================================================ */

const app = document.getElementById("app");
function h(html) { stopToneMeter(); app.innerHTML = html; window.scrollTo(0, 0); }
function el(id) { return document.getElementById(id); }
function on(id, fn) { const e = el(id); if (e) e.onclick = fn; }

function topbar(crumb) {
  return `<div class="topbar">
    <button class="home-btn" id="nav-home" title="Home">🏠</button>
    <span class="crumb">${crumb || ""}</span>
  </div>`;
}
function wireTopbar() { on("nav-home", showHome); }

function bar(cur, total) {
  return `<div class="progressbar"><div style="width:${Math.round(cur / total * 100)}%"></div></div>`;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function micButton() {
  return `
    <button class="big amber" id="mic-btn">🎤 Check my pronunciation</button>
    <div class="feedback" id="mic-fb"></div>`;
}
function wireMic(p) {
  const btn = el("mic-btn"), fb = el("mic-fb");
  if (!btn) return;
  btn.onclick = () => {
    fb.className = "feedback show info";
    fb.textContent = "Getting the microphone ready…";
    btn.disabled = true;
    listenFor(p.accept, {
      onstart: () => {
        fb.className = "feedback show info";
        fb.textContent = "🔴 Listening — say it now!";
      },
      onhear: () => {
        fb.className = "feedback show info";
        fb.textContent = "🔴 I can hear you…";
      },
      onresult: (ok, heard, recUrl) => {
        btn.disabled = false;
        const heardPy = pinyinFor(heard);
        const mineBtn = recUrl
          ? `<button id="fb-mine">🎧 My voice (real recording)</button>`
          : `<button id="fb-rec">🎧 Record me to compare</button>`;
        const row = `<div class="fb-row" id="fb-row">${mineBtn}<button id="fb-target">🔊 The target</button></div>`;
        if (ok) {
          fb.className = "feedback show good";
          fb.innerHTML = `✅ Understood you perfectly!<br><b>It heard:</b> ${heard} (${heardPy})
            ${row}
            Hearing yourself next to the target is the fastest way to polish the tones.`;
        } else {
          fb.className = "feedback show bad";
          fb.innerHTML = `🤔 Not quite — but here's exactly what happened:<br>
            <b>It heard you say:</b> ${heard} (${heardPy})<br>
            <b>You're aiming for:</b> ${p.hanzi.replace(/[？?]/g, "")} — ${p.pinyin} · sounds like "${p.phon}"
            ${row}
            Listen for the difference, then have another go.`;
        }
        const wireRow = (url) => {
          on("fb-mine", () => { try { new Audio(url).play(); } catch (e) {} });
          on("fb-target", () => speak(p.hanzi, 0.8));
          on("fb-rec", () => {
            const rb = el("fb-rec");
            rb.disabled = true;
            rb.textContent = "🔴 Say it now…";
            recordClip((newUrl, err) => {
              if (newUrl) {
                el("fb-row").innerHTML = `<button id="fb-mine">🎧 My voice</button><button id="fb-target">🔊 The target</button>`;
                wireRow(newUrl);
                try { new Audio(newUrl).play(); } catch (e) {}
              } else {
                rb.disabled = false;
                rb.textContent = "🎧 Record me to compare";
                fb.append(" " + (err || ""));
              }
            });
          });
        };
        wireRow(recUrl);
      },
      onerror: (msg) => {
        btn.disabled = false;
        fb.className = "feedback show bad";
        fb.textContent = msg;
      }
    });
  };
}

function toneChip(pinyinSyll, tone) {
  const c = TONE_COLORS[tone];
  return `<div class="chip" style="background:${c}14;border:2px solid ${c}55">
    ${curveSvg(tone, 52)}
    <div class="chip-p" style="color:${c}">${pinyinSyll}</div>
    <div class="chip-t" style="color:${c}">${TONE_LABELS[tone]}</div>
  </div>`;
}

function toneChips(p) {
  if (!p.ptones) return "";
  const written = p.psyll.map((s, i) => toneChip(s, p.ptones[i])).join("");
  if (p.spoken) {
    const spoken = p.spoken.psyll.map((s, i) => toneChip(s, p.spoken.ptones[i])).join("");
    return `
      <div class="chips-label">As written:</div>
      <div class="tone-chips">${written}</div>
      <div class="chips-label">How it's really said:</div>
      <div class="tone-chips">${spoken}</div>
      <div class="sandhi">🤹 ${p.note}</div>`;
  }
  const note = p.note ? `<div class="sandhi">💬 ${p.note}</div>` : "";
  return `<div class="tone-chips">${written}</div>${note}`;
}

let micStream = null, micRaf = null;
function stopMicTest() {
  if (micRaf) cancelAnimationFrame(micRaf);
  micRaf = null;
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
}

function showMicCheck() {
  h(`
    ${topbar("Microphone check")}
    <h2>Microphone check</h2>
    <p class="subtitle">Tap start, then talk — the green bar should jump as you speak.</p>
    <div class="card">
      <button class="big amber" id="mic-start">🎙️ Start microphone test</button>
      <div id="meter-wrap" style="display:none">
        <div style="height:28px;background:#f2e8d8;border-radius:14px;overflow:hidden;margin:16px 0 10px">
          <div id="meter" style="height:100%;width:0%;background:linear-gradient(90deg,#43c76b,#1e9e63)"></div>
        </div>
        <p class="diag" id="mic-device"></p>
        <p id="mic-verdict" style="font-weight:600;margin-top:8px">Say something…</p>
      </div>
      <div class="feedback" id="mc-fb"></div>
    </div>
    <div class="tip">If the bar stays flat while you talk, the wrong microphone is selected — check your sound input settings, then test again.</div>
    <button class="big grey" id="back">← Back to menu</button>
  `);
  wireTopbar();
  on("nav-home", () => { stopMicTest(); showHome(); });
  on("back", () => { stopMicTest(); showHome(); });
  on("mic-start", () => {
    const fb = el("mc-fb");
    stopMicTest();
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      fb.className = "feedback show bad";
      fb.textContent = "This browser can't open the microphone this way.";
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
      micStream = stream;
      el("meter-wrap").style.display = "block";
      fb.className = "feedback"; fb.textContent = "";
      const track = stream.getAudioTracks()[0];
      el("mic-device").textContent = "Listening on: " + (track && track.label ? track.label : "(unnamed microphone)");
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const src = ctx.createMediaStreamSource(stream);
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 512;
      src.connect(analyser);
      const data = new Uint8Array(analyser.fftSize);
      let best = 0;
      const loop = () => {
        analyser.getByteTimeDomainData(data);
        let sum = 0;
        for (let i = 0; i < data.length; i++) { const d = (data[i] - 128) / 128; sum += d * d; }
        const level = Math.min(1, Math.sqrt(sum / data.length) * 4);
        el("meter").style.width = Math.round(level * 100) + "%";
        if (level > best) best = level;
        el("mic-verdict").textContent =
          best > 0.25 ? "✅ Loud and clear — your microphone works!"
          : best > 0.08 ? "🟡 I can hear you faintly — get closer or speak up a little."
          : "Say something…";
        micRaf = requestAnimationFrame(loop);
      };
      loop();
    }).catch((err) => {
      fb.className = "feedback show bad";
      fb.textContent = (err && err.name === "NotFoundError")
        ? "No microphone was found — is one plugged in?"
        : (err && err.name === "NotAllowedError")
        ? "The microphone was blocked — tap the padlock next to the address, allow the microphone, and reload."
        : "Couldn't open the microphone (" + (err && err.name) + ").";
    });
  });
}

function totalParts(li) { return LESSONS[li].sets.length + 2; }
function speakItems(li) {
  return LESSONS[li].sets.flatMap(s => s.items || []).filter(p => p.speak);
}

function showSetIntro(li, si) {
  const lesson = LESSONS[li];
  const set = lesson.sets[si];
  if (set.type === "tones") return showToneIntro(li);
  h(`
    ${topbar(`Lesson ${li + 1} · Part ${si + 1} of ${totalParts(li)}`)}
    ${bar(si + 1, totalParts(li))}
    <h2>Part ${si + 1} — ${set.name}</h2>
    <p class="subtitle">${set.blurb || ""}</p>
    ${set.challenge === "count" ? `<div class="card"><div class="numgrid">${set.items.map(x => `<div class="n">${x.hanzi}</div>`).join("")}</div><p class="center" style="font-size:15px;color:#a08872">…and a counting challenge at the end!</p></div>` : ""}
    <button class="big green" id="start">Start →</button>
    <button class="big grey" id="back">← Back</button>
  `);
  wireTopbar();
  on("start", () => showCard(li, si, 0));
  on("back", () => {
    if (si === 0) showHome();
    else backIntoSet(li, si - 1);
  });
}

function backIntoSet(li, si) {
  const set = LESSONS[li].sets[si];
  if (set.type === "tones") showTone(li, 3);
  else if (set.challenge === "count") showCountChallenge(li, si);
  else showCard(li, si, set.items.length - 1);
}

function showCard(li, si, ii) {
  const lesson = LESSONS[li];
  const set = lesson.sets[si];
  if (set.type === "tones") return showTone(li, ii);
  const p = set.items[ii];
  const n = set.items.length;
  h(`
    ${topbar(`Lesson ${li + 1} · ${set.name} · ${ii + 1} / ${n}`)}
    ${bar(si + 1, totalParts(li))}
    <h2>${set.name}</h2>
    <div class="card center">
      <div class="hanzi">${p.hanzi}</div>
      <div class="pinyin">${p.pinyin}</div>
      <div class="soundslike">🗣 sounds like: "${p.phon}"</div>
      <div class="english">${p.english}</div>
      ${toneChips(p)}
    </div>
    <div class="btn-row">
      <button class="big blue" id="listen">🔊 Listen</button>
      <button class="big teal" id="slow">🐢 ${p.syll.length > 1 ? "Syllable by syllable" : "Slowly"}</button>
    </div>
    ${micButton()}
    ${p.syll.length === 1 ? `<p class="center" style="font-size:15px;color:#a08872;margin-top:2px">Tip: single sounds are tricky for the checker — say it a few times in one breath: "${p.pinyin} ${p.pinyin} ${p.pinyin}".</p>` : ""}
    <div class="btn-row">
      <button class="big grey" id="back">← Back</button>
      <button class="big green" id="next">Next →</button>
    </div>
  `);
  wireTopbar();
  on("listen", () => speak(p.hanzi, 0.8));
  on("slow", () => p.syll.length > 1 ? speakSlow(p.syll) : speak(p.hanzi, 0.4));
  wireMic(p);
  on("back", () => ii === 0 ? showSetIntro(li, si) : showCard(li, si, ii - 1));
  on("next", () => {
    if (ii < n - 1) showCard(li, si, ii + 1);
    else if (set.challenge === "count") showCountChallenge(li, si);
    else finishSet(li, si);
  });
}

function finishSet(li, si) {
  markDone(LESSONS[li].id, "set" + si);
  if (si + 1 < LESSONS[li].sets.length) showSetIntro(li, si + 1);
  else showSpeakIntro(li);
}

/* Counting challenge — say 1..10 in one go (multi-syllable, so the
   recogniser handles it well) */
function showCountChallenge(li, si) {
  const digitMap = { "零":"0","一":"1","二":"2","三":"3","四":"4","五":"5","六":"6","七":"7","八":"8","九":"9","十":"10" };
  const countOk = (c) => {
    let d = "";
    for (const ch of c) d += digitMap[ch] !== undefined ? digitMap[ch] : (/[0-9]/.test(ch) ? ch : "");
    return /1.*2.*3.*4.*5.*6.*7.*8.*9/.test(d);
  };
  h(`
    ${topbar(`Lesson ${li + 1} · Counting challenge`)}
    ${bar(si + 1, totalParts(li))}
    <h2>🏆 The counting challenge</h2>
    <p class="subtitle">Count from 1 to 10 out loud, in one steady go: yī, èr, sān, sì, wǔ, liù, qī, bā, jiǔ, shí!</p>
    <div class="card">
      <div class="numgrid">${LESSON2_NUMBERS.slice(1).map(x => `<div class="n">${x.hanzi} ${x.pinyin}</div>`).join("")}</div>
    </div>
    <button class="big blue" id="listen">🔊 Hear it counted first</button>
    <button class="big amber" id="mic-btn">🎤 My turn — listen to me count!</button>
    <div class="feedback" id="mic-fb"></div>
    <div class="btn-row">
      <button class="big grey" id="back">← Back</button>
      <button class="big green" id="next">Next →</button>
    </div>
  `);
  wireTopbar();
  on("listen", () => speakSlow(LESSON2_NUMBERS.slice(1).map(x => x.hanzi)));
  wireMic({ accept: countOk, pinyin: "yī èr sān sì wǔ liù qī bā jiǔ shí",
            hanzi: "一二三四五六七八九十", phon: "ee, ar, sahn, suh, woo, lyoh, chee, bah, jyoh, shr" });
  on("back", () => showCard(li, si, LESSONS[li].sets[si].items.length - 1));
  on("next", () => finishSet(li, si));
}

function wireToneMeter(t) {
  const btn = el("tone-btn"), fb = el("tone-fb"), res = el("tone-res");
  const c = TONE_COLORS[t.n];
  btn.onclick = () => {
    btn.disabled = true;
    res.style.display = "none";
    fb.className = "feedback show info";
    fb.textContent = "Getting the microphone ready…";
    runToneMeter(t.n, {
      onlisten: () => {
        fb.className = "feedback show info";
        fb.textContent = `🔴 Listening — say "${t.phon}" now, one steady go…`;
      },
      onresult: (detected, pts, recUrl) => {
        btn.disabled = false;
        const svg = el("tone-res-svg");
        const userPath = "M" + pts.map(p => p[0] + "," + p[1]).join(" L");
        svg.innerHTML = `
          <line x1="10" y1="10" x2="10" y2="75" stroke="#eadbc8" stroke-width="2"/>
          <line x1="10" y1="75" x2="110" y2="75" stroke="#eadbc8" stroke-width="2"/>
          <path d="${TONE_PATHS[t.n]}" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="12 9" opacity="0.55"/>
          <path d="${userPath}" stroke="#33261d" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
        el("tone-mine-slot").innerHTML = recUrl
          ? `<div class="fb-row"><button id="tone-mine">🎧 My voice</button><button id="tone-target">🔊 The target</button></div>`
          : "";
        on("tone-mine", () => { try { new Audio(recUrl).play(); } catch (e) {} });
        on("tone-target", () => speak(t.hanzi, 0.8));
        res.style.display = "block";
        if (detected === t.n) {
          fb.className = "feedback show good";
          fb.textContent = `✅ Beautiful! Your voice went ${TONE_WORDS[t.n]} — a proper tone ${t.n}. Look how your curve follows the target!`;
        } else if (detected === 0) {
          fb.className = "feedback show info";
          fb.textContent = "Hmm, your tune wandered a bit and I couldn't pin it down — look at your curve above, then listen 🔊 once more and have another go.";
        } else {
          fb.className = "feedback show bad";
          fb.textContent = `🤔 Not quite — your voice went ${TONE_WORDS[detected]} (that's a tone ${detected}), but tone ${t.n} should be ${TONE_WORDS[t.n]}. Compare the two curves above and try again.`;
        }
      },
      onerror: (msg) => {
        btn.disabled = false;
        fb.className = "feedback show bad";
        fb.textContent = msg;
      }
    });
  };
}

/* ---------- Speaking from memory ---------- */

function showSpeakIntro(li) {
  const part = LESSONS[li].sets.length + 1;
  h(`
    ${topbar(`Lesson ${li + 1} · Part ${part} of ${totalParts(li)}`)}
    ${bar(part, totalParts(li))}
    <h2>Part ${part} — Say it from memory</h2>
    <p class="subtitle">You'll see only the English and the pinyin. Say the phrase out loud and let the app check you. Peek with 🔊 if you're stuck — that's allowed!</p>
    <button class="big green" id="start">Start speaking practice →</button>
    <button class="big grey" id="back">← Back</button>
  `);
  wireTopbar();
  on("start", () => showSpeak(li, 0));
  on("back", () => backIntoSet(li, LESSONS[li].sets.length - 1));
}

function showSpeak(li, i) {
  const items = speakItems(li);
  const p = items[i];
  const n = items.length;
  const part = LESSONS[li].sets.length + 1;
  h(`
    ${topbar(`Lesson ${li + 1} · Speaking · ${i + 1} / ${n}`)}
    ${bar(part, totalParts(li))}
    <h2>Say this in Mandarin:</h2>
    <div class="card center">
      <div class="english" style="font-size:24px;color:#33261d;font-weight:600">${p.english}</div>
      <div class="pinyin">${p.pinyin}</div>
      <div class="soundslike">🗣 "${p.phon}"</div>
    </div>
    ${micButton()}
    <button class="big outline" id="peek">🔊 Remind me how it sounds</button>
    <div class="btn-row">
      <button class="big grey" id="back">← Back</button>
      <button class="big green" id="next">${i < n - 1 ? "Next →" : "On to the test →"}</button>
    </div>
  `);
  wireTopbar();
  wireMic(p);
  on("peek", () => speak(p.hanzi, 0.8));
  on("back", () => i === 0 ? showSpeakIntro(li) : showSpeak(li, i - 1));
  on("next", () => {
    if (i < n - 1) showSpeak(li, i + 1);
    else { markDone(LESSONS[li].id, "speaking"); showQuizIntro(li); }
  });
}

/* ============================================================
   QUIZ — random draw from the pool, shuffled options
   ============================================================ */

let curQuiz = null; // {mode:"lesson"|"review", li, qs, idx, score}

function buildQuestions(pool, count) {
  return shuffle(pool).slice(0, count).map(q => {
    if (q.type === "text") {
      const pairs = shuffle(q.options.map((o, i) => ({ o, correct: i === q.answer })));
      return { id: q.id, type: "text", play: q.play, q: q.q,
               options: pairs.map(p => p.o), answer: pairs.findIndex(p => p.correct) };
    }
    return { ...q };
  });
}

function buildReviewQuestions(count) {
  const pool = LESSONS.filter(l => progress[l.id] && progress[l.id].done)
                      .flatMap(l => l.quizPool);
  const m = progress.mistakes || {};
  // weighted shuffle: questions you've got wrong before come up more often
  const weighted = pool.map(q => ({ q, w: (1 + 2 * (m[q.id] || 0)) * Math.random() }))
                       .sort((a, b) => b.w - a.w)
                       .map(x => x.q);
  // pick the weighted top slice FIRST, then let buildQuestions shuffle their order
  const chosen = weighted.slice(0, Math.min(count, weighted.length));
  return buildQuestions(chosen, chosen.length);
}

function showQuizIntro(li) {
  const part = totalParts(li);
  h(`
    ${topbar(`Lesson ${li + 1} · Part ${part} of ${part}`)}
    ${bar(part, part)}
    <h2>Part ${part} — The test</h2>
    <p class="subtitle">${QUIZ_LEN} questions, drawn fresh from a bigger pool each time — no two tests are quite the same. Score 95%+ to unlock the next lesson. Sound on!</p>
    <button class="big green" id="start">Start the test →</button>
    <button class="big grey" id="back">← Back</button>
  `);
  wireTopbar();
  on("start", () => {
    curQuiz = { mode: "lesson", li, qs: buildQuestions(LESSONS[li].quizPool, QUIZ_LEN), idx: 0, score: 0 };
    showQuizQ();
  });
  on("back", () => showSpeak(li, speakItems(li).length - 1));
}

function startReview() {
  curQuiz = { mode: "review", li: null, qs: buildReviewQuestions(QUIZ_LEN), idx: 0, score: 0 };
  if (!curQuiz.qs.length) { showHome(); return; }
  showQuizQ();
}

function showQuizQ() {
  const { qs, idx } = curQuiz;
  const q = qs[idx];
  const n = qs.length;
  const crumb = curQuiz.mode === "review" ? "Review quiz" : `Lesson ${curQuiz.li + 1} test`;
  const isTone = q.type === "tone";
  h(`
    ${topbar(`${crumb} · ${idx + 1} / ${n}`)}
    ${bar(idx + 1, n)}
    <h2>Question ${idx + 1}</h2>
    <p class="subtitle">${isTone ? "Listen, then choose: which tone did you hear?" : (q.q || "")}</p>
    ${q.play ? `<button class="big blue" id="play">🔊 Play the sound</button>` : ""}
    <div id="opts">
      ${isTone
        ? [1,2,3,4].map(t => `<button class="quiz-option" data-a="${t}">${curveSvg(t, 44)}<span>Tone ${t} — ${TONE_WORDS[t]}</span></button>`).join("")
        : q.options.map((o, i) => `<button class="quiz-option" data-a="${i}"><span>${o}</span></button>`).join("")}
    </div>
    <div class="feedback" id="fb"></div>
    <button class="big green" id="next" disabled>${idx < n - 1 ? "Next question →" : "See my score →"}</button>
  `);
  wireTopbar();
  if (q.play) {
    on("play", () => speak(q.play, 0.7));
    setTimeout(() => speak(q.play, 0.7), 350);
  }
  document.querySelectorAll(".quiz-option").forEach(btn => {
    btn.onclick = () => {
      if (el("next").disabled === false) return;
      const chosen = Number(btn.dataset.a);
      const fb = el("fb");
      const correct = isTone ? q.answer : q.answer;
      const right = chosen === correct;
      noteMistake(q.id, !right);
      if (right) {
        curQuiz.score++;
        btn.classList.add("correct");
        fb.className = "feedback show good";
        fb.textContent = isTone ? `✅ Right! That was ${q.pinyin} — tone ${q.answer}.` : "✅ Correct!";
      } else {
        btn.classList.add("wrong");
        document.querySelector(`.quiz-option[data-a="${correct}"]`).classList.add("correct");
        fb.className = "feedback show bad";
        fb.textContent = isTone
          ? `That was ${q.pinyin} — tone ${q.answer}, ${TONE_WORDS[q.answer]}. Tap 🔊 to hear it again.`
          : `The answer is: ${q.options[q.answer]}`;
      }
      el("next").disabled = false;
    };
  });
  on("next", () => {
    if (curQuiz.idx < n - 1) { curQuiz.idx++; showQuizQ(); }
    else showResults();
  });
}

function showResults() {
  const { mode, li, score, qs } = curQuiz;
  const total = qs.length;
  const pct = score / total;
  let unlockMsg = "";
  if (mode === "review") {
    recordReview(score, total);
  } else {
    const newlyPassed = recordQuiz(LESSONS[li].id, score, total);
    if (pct >= PASS_RATE) {
      if (newlyPassed && li + 1 < LESSONS.length) unlockMsg = `🎉 <b>Lesson ${li + 2} is now unlocked!</b>`;
      else if (li + 1 >= LESSONS.length) unlockMsg = `🏆 You've passed everything I've built so far — tell Claude you're ready for Lesson ${li + 2}!`;
      else unlockMsg = `🏆 Passed again — nicely done!`;
    } else {
      unlockMsg = `You need ${Math.ceil(total * PASS_RATE)}/${total} to unlock the next lesson — the test reshuffles every time, so have another run!`;
    }
  }
  const msg = pct === 1 ? "Perfect score — 太好了 (tài hǎo le)! Brilliant!"
    : pct >= 0.75 ? "Great work — you've really got this!"
    : pct >= 0.5 ? "Good effort — worth another run through tomorrow."
    : "Tough one — everyone finds this hard at first. Rerun the lesson and it will click.";
  const s = progress.streak;
  h(`
    ${topbar(mode === "review" ? "Review complete" : `Lesson ${li + 1} complete`)}
    <div class="big-emoji">${pct >= 0.75 ? "🎉🐼🎉" : "💪🐼"}</div>
    <h2 class="center">You scored ${score} / ${total}</h2>
    <p class="subtitle center">${msg}</p>
    ${unlockMsg ? `<div class="card center" style="font-size:17px">${unlockMsg}</div>` : ""}
    ${s && s.count > 1 ? `<p class="streak">🔥 ${s.count}-day streak!</p>` : ""}
    <button class="big green" id="again">${mode === "review" ? "Another review round" : "Try the test again"}</button>
    <button class="big grey" id="home">← Back to menu</button>
    <p class="center" style="color:#a08872;font-size:15px;margin-top:14px">再见 — see you tomorrow! 👋</p>
  `);
  wireTopbar();
  on("again", () => {
    if (mode === "review") startReview();
    else {
      curQuiz = { mode: "lesson", li, qs: buildQuestions(LESSONS[li].quizPool, QUIZ_LEN), idx: 0, score: 0 };
      showQuizQ();
    }
  });
  on("home", showHome);
}

/* ============================================================ */
showHome();

if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
